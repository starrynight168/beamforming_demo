# MBAN 统一评估计划。
# models.model_type 只选一种：这批 checkpoint 会全部按同一种评估类型运行。
# models.items 按顺序填写 checkpoint；display_name 只用于结果展示，省略时自动命名 model1、model2……。
# enabled.evaluations 只选择本次运行的评估；详细参数统一写在 evaluations 下。
#
# 常用选择：
#   FP32 四场景 + 50 帧活体：model_type=fp32，items 填 FP32 模型，启用 scenes/invivo。
#   QAT 四场景 + 50 帧活体：model_type=qat，items 填 QAT 模型，启用 scenes/invivo。
#   PTQ 四场景 + 50 帧活体：model_type=ptq，items 填 FP32 checkpoint，启用 scenes/invivo。
#   MC/trace 只支持 qat 或 ptq；不符合时加载配置即报错。

version: 3

paths:
  config: config.yaml
  hardware_config: hardware_eval.yaml
  scene_config: ../config.yaml
  split_file: results/model_ablation/shared_split_seed42_0p7-0p2-0p1.csv
  output: results/eval

runtime:
  device: cuda
  micro_batch: 8192
  seed: 42

models:
  model_type: fp32
  profile: null
  overrides: {}
  items:
    - display_name: FP32
      checkpoint: results/model_ablation/model/FP32/H32/OC16/best_val.pth

enabled:
  evaluations: [scenes, invivo]

evaluations:
  scenes:
    mode: scenes
    output: scenes
    scenes:
      - simulation_contrast_speckle
      - simulation_resolution_distorsion
      - experiments_contrast_speckle
      - experiments_resolution_distorsion
    monte_carlo_runs: 1
    skip_baselines: false
    collect_weight_stats: false
    no_weight_curves: true
    reference_method: null

  invivo:
    mode: test
    output: invivo
    test_frames: 50

  scenes_mc4:
    mode: scenes
    output: scenes_mc4
    profile: common
    scenes:
      - simulation_contrast_speckle
      - simulation_resolution_distorsion
      - experiments_contrast_speckle
      - experiments_resolution_distorsion
    monte_carlo_runs: 4
    skip_baselines: true
    collect_weight_stats: false
    no_weight_curves: true
    reference_method: null

  invivo_mc4:
    mode: mc
    output: invivo_mc4
    profile: common
    runs: 4
    test_frames: 50

  ptq4_test:
    mode: ptq
    output: ptq4_test
    test_frames: 50

  weights:
    mode: weights
    output: weights
    scenes:
      - simulation_contrast_speckle
      - simulation_resolution_distorsion
      - experiments_contrast_speckle
      - experiments_resolution_distorsion

  paired_stats:
    mode: stats
    output: paired_stats
    input: results/eval/invivo/test_frame_ssim.csv
    reference: FP32
    bootstrap_samples: 10000

  figures:
    mode: figures
    output: figures
    test_frames: 5
    f_number: 1.5

  trace_qat_ptq:
    mode: trace
    output: trace_qat_ptq
    frames: 0,1,2,3,4,5
    test_frames: 10
    runs: 1
    verification_atol: 1.0e-6
    verification_ssim_atol: 1.0e-8

  common_hardware:
    mode: hardware
    output: common_hardware
    profile: common
    references_json: results/eval/calibrate/nonideal_references.json
    mc_runs: 30

  hardware_calibration:
    mode: calibrate
    output: calibrate

  deployment:
    mode: deployment
    output: deployment
    profile: common

  mapping:
    mode: mapping
    output: mapping
    mapping_mode: custom_compact
    tile_rows: 64
    tile_cols: 64
    converter_schedule: parallel
    differential_readout: post_tia_subtractor

  crosssim:
    mode: crosssim
    output: crosssim
    tile_rows: 64
    tile_cols: 64
    weight_bits: 4
    crosssim_runs: 8

  ppa:
    mode: ppa
    output: ppa
    mapping_mode: custom_compact
    tile_rows: 64
    tile_cols: 64
    converter_schedule: parallel
    input_timing: analog_single_pulse
    differential_readout: post_tia_subtractor
    weight_bits: 4
    input_bits: 4
    adc_bits: 4
    technology_node: 32
