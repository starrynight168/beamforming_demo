version: 1  # 硬件评估配置格式版本

hardware:  # 硬件仿真和量化的基础配置
  inter_layer: analog  # 层间数据流：none、analog 或 digital
  inter_layer_bits: 4  # 数字层间 ADC/DAC 的位宽
  weight_bits: 4  # 忆阻器权重映射位宽
  input_bits: 4  # 输入 DAC 位宽
  control_bits: 4  # 输出 control ADC 位宽
  bias_bits: 4  # ordinary bias 位宽；array bias 随 weight_bits 量化
  bias_implementation: ordinary  # array使用常量输入列；ordinary bias 跟随 inter_layer
  g_min: 0.2428115  # 忆阻器归一化最小电导
  g_max: 1.0  # 忆阻器归一化最大电导
  per_output_channel: false  # 是否按输出通道独立映射权重范围
  observer_enabled: true  # 是否启用运行量程观测器
  fixed_observer_calibration: true  # 是否冻结校准后的量程
  observer_calibration_epochs: 3  # observer 校准使用的训练轮数
  ptq_calibration_samples: 4  # PTQ 校准样本数
  public_gain_max: 16.0  # 最终权重归一化允许的最大增益
  input_tile_features: 0  # 输入分块大小；0 表示不分块
  interpolation_bits: 32  # 插值分数位宽；linear/cubic 使用，nearest 不使用

qat_schedule:  # QAT 分阶段训练计划
  enabled: true  # 是否启用分阶段 QAT
  stages:  # QAT 阶段列表
    - name: quantized  # 第一阶段：只加入理想量化
      epochs: 5  # 第一阶段训练轮数
      profile: ideal  # 使用 ideal 公共压力 profile
      overrides:  # 本阶段覆盖的硬件参数
        noise_seed: 1000000  # 第一阶段硬件随机种子
    - name: representative_stress  # 第二阶段：公共非理想压力训练
      epochs: 95  # 第二阶段训练轮数
      profile: common  # 使用 common 公共压力 profile
      overrides:  # 本阶段覆盖的硬件参数
        noise_seed: 1000000  # 第二阶段硬件随机种子

nonidealities:  # 硬件非理想参数和压力 profile
  active_profile: ideal  # 默认使用的 profile 名称
  parameters:  # 所有 profile 共用的参数默认值
    tia_noise_mode: full_scale  # TIA 噪声模式：满量程
    tia_noise_reference: 1.0  # TIA 满量程噪声参考值
    tia_saturation_mode: full_scale  # TIA 饱和量程模式
    tia_saturation_reference: 1.0  # TIA 饱和参考值
    activation_threshold_mode: full_scale  # 激活阈值的量程模式
    activation_threshold_mismatch_mode: full_scale  # 激活阈值失配的量程模式
    activation_threshold_reference: 1.0  # 激活阈值参考量程
    activation_threshold_references: {}  # 各层激活阈值参考量程
    write_noise_mode: full_scale  # 写入误差模式：满量程
    read_noise_mode: common_mode_relative  # 读取噪声模式：共模相对噪声
    bias_programming_gain_error: 0.0  # bias 编程增益误差；当前关闭
    bias_programming_offset: 0.0  # bias 编程偏置误差；当前关闭
    bias_noise_std: 0.0  # bias 动态噪声标准差；当前关闭
    bias_channel_gain_mismatch_std: 0.0  # bias 通道增益失配；当前关闭
    bias_noise_reference: 1.0  # bias 噪声参考值
    tia_channel_gain_mismatch_std: 0.0  # TIA 通道增益失配默认值；由 common 单独设置
    tia_channel_offset_mismatch_std: 0.0  # TIA 通道 offset 失配；当前关闭
    adc_channel_gain_mismatch_std: 0.0  # ADC 通道增益失配；当前关闭
    adc_channel_offset_mismatch_std: 0.0  # ADC 通道 offset 失配；当前关闭
    control_reference_gain_error: 0.0  # L∞ reference 固定增益误差；固定项关闭
    control_reference_offset: 0.0  # L∞ reference offset；当前关闭
    control_reference_noise_std: 0.0  # L∞ reference 动态噪声；由 common 单独设置
    control_reference_hold_error: 0.0  # L∞ reference 保持误差；当前关闭
    ir_drop_tile_rows: 64  # IR-drop 阵列行方向 tile 大小
    ir_drop_tile_cols: 64  # IR-drop 阵列列方向 tile 大小
    ir_drop_wire_resistance: 0.35   # Ω per cell segment，行线和列线均使用
    ir_drop_g_max: 3.13e-5  # IR-drop 使用的最大实际电导
    ir_drop_v_read: 0.3  # IR-drop 读电压
    adc_noise_mode: full_scale  # 所有 ADC 噪声模式：满量程
    adc_nonlinearity_beta: 3.0  # 所有 ADC 平滑非线性曲率参数
    dac_noise_mode: full_scale  # 所有 DAC 噪声模式：满量程
    dac_nonlinearity_beta: 3.0  # 所有 DAC 平滑非线性曲率参数
    stuck_at_high_fraction: 0.5  # stuck-at 故障中固定为高电导的比例
    static_mismatch_std: {}  # 各固定失配的标准差映射；默认无失配
  profiles:  # 公共硬件压力 profile
    ideal:  # 理想非理想参数 profile
      parameters: {}  # 不额外加入公共非理想误差
    common:  # 公共硬件压力 profile
      parameters:  # common 的实际压力参数
        ir_drop_enabled: true  # 开启 IR-drop
        ir_drop_wire_resistance: 0.35  # common 的 IR-drop 线阻
        ir_drop_tile_rows: 64  # common 的 IR-drop 行 tile 大小
        ir_drop_tile_cols: 64  # common 的 IR-drop 列 tile 大小
        ir_drop_g_max: 3.13e-5  # common 的 IR-drop 最大电导
        ir_drop_v_read: 0.3  # common 的 IR-drop 读电压
        adc_noise_std: 0.0333333333  # 所有 ADC 动态噪声标准差
        adc_nonlinearity: 0.02  # 所有 ADC 平滑非线性强度
        adc_nonlinearity_beta: 3.0  # 所有 ADC 非线性曲率
        dac_gain_error: 0.0  # 所有 DAC 公共增益误差；标准差由 static_mismatch_std 给出
        dac_offset: 0.0  # 所有 DAC 公共 offset；标准差由 static_mismatch_std 给出
        dac_noise_std: 0.0333333333  # 所有 DAC 动态噪声标准差
        dac_noise_mode: local_relative  # 所有 DAC 噪声按信号幅值相对定义
        dac_nonlinearity: 0.02  # 所有 DAC 平滑非线性强度
        dac_nonlinearity_beta: 3.0  # 所有 DAC 非线性曲率
        drift_std: 0.07  # 忆阻器漂移快照标准差
        stuck_at_prob: 0.01  # 忆阻器 stuck-at 概率
        stuck_at_high_fraction: 0.5  # stuck-at 中高电导故障比例
        noise_enabled: true  # 开启动态和静态噪声
        write_error_std: 0.05  # 忆阻器写入误差标准差
        write_noise_mode: full_scale  # 写入误差按满量程定义
        read_noise_std: 0.02  # 忆阻器读取噪声标准差
        read_noise_mode: common_mode_relative  # 读取噪声按共模相对电流定义
        tia_gain_error: 0.0  # TIA 公共增益误差；标准差由 static_mismatch_std 给出
        tia_channel_gain_mismatch_std: 0.02  # TIA 通道固定增益失配标准差
        tia_offset: 0.0  # TIA 公共 offset；按归一化 TIA FS 解释
        tia_channel_offset_mismatch_std: 0.005  # TIA 通道 offset 失配；归一化 TIA FS
        tia_noise_mode: full_scale  # TIA 噪声按满量程定义
        tia_noise_reference: 1.0  # TIA 噪声满量程参考值
        tia_noise_std: 0.005  # TIA 动态输出噪声标准差
        tia_saturation: 0.0  # TIA 饱和上限；当前关闭
        tia_saturation_mode: full_scale  # TIA 饱和量程模式
        tia_saturation_reference: 1.0  # TIA 饱和参考值
        buffer_gain_error: 0.0  # analog buffer 公共增益误差；标准差由 static_mismatch_std 给出
        buffer_noise_std: 0.0025  # analog buffer 动态噪声；本层参考幅度的 0.25%
        activation_gain_mismatch: 0.0  # 激活电路公共增益误差；标准差由 static_mismatch_std 给出
        activation_threshold: 0.0  # 激活转折点公共偏移；标准差由 static_mismatch_std 给出
        activation_threshold_mismatch: 0.0  # 激活转折点通道/支路失配；标准差由 static_mismatch_std 给出
        bias_programming_gain_error: 0.0  # bias 公共编程增益误差；标准差由 static_mismatch_std 给出
        bias_programming_offset: 0.0  # bias 公共 offset；按归一化 Bias FS 解释
        bias_noise_std: 0.0025  # bias 动态噪声；归一化 Bias FS 的 0.25%
        bias_channel_gain_mismatch_std: 0.01  # bias 通道增益失配标准差
        bias_noise_reference: 1.0  # bias 噪声参考值
        control_reference_gain_error: 0.0  # L∞ reference 固定增益误差基值
        control_reference_offset: 0.0  # L∞ reference offset；当前关闭
        control_reference_noise_std: 0.0166667  # L∞ reference 动态噪声，约 0.25 LSB
        control_reference_hold_error: 0.0  # L∞ reference 保持误差；当前关闭
        adc_gain_error: 0.0  # 输出 ADC 公共增益误差；标准差由 static_mismatch_std 给出
        adc_channel_gain_mismatch_std: 0.01  # 输出 ADC 通道增益失配标准差
        adc_offset: 0.0  # 输出 ADC 公共 offset；标准差为 0.1 个 4-bit endpoint LSB
        adc_channel_offset_mismatch_std: 0.0066667  # 输出 ADC 通道 offset；0.1*(1/15)
        static_mismatch_std:  # common 的固定公共误差标准差
          bias_programming_gain_error: 0.01
          bias_programming_offset: 0.005
          tia_gain_error: 0.01
          tia_offset: 0.005
          buffer_gain_error: 0.01
          activation_gain_mismatch: 0.01
          activation_threshold: 0.005
          activation_threshold_mismatch: 0.005
          adc_gain_error: 0.01
          adc_offset: 0.0066667
          dac_gain_error: 0.01
          dac_offset: 0.0066667
          control_reference_gain_error: 0.01  # control_normalization=none 时不生效

stress:  # MC 和硬件压力评估配置
  mc_runs: 30  # Monte Carlo 硬件实例数量
  base_overrides:  # 所有 stress case 的基础覆盖参数
    activation_threshold_references: "${references}"  # 从校准文件注入激活阈值参考
    ir_drop_tile_rows: "${tile_rows}"  # 从命令行注入 IR-drop 行 tile
    ir_drop_tile_cols: "${tile_cols}"  # 从命令行注入 IR-drop 列 tile
    noise_seed: "${seed}"  # 从 MC seed 注入硬件随机种子
  cases:  # stress 场景列表
    - name: common  # 当前 MC 场景名称
      profile: common  # 使用 common 公共压力 profile
      protocol: mc  # 使用 Monte Carlo 协议
      noise_enabled: true  # 开启硬件非理想误差
      overrides:  # 当前场景的额外覆盖参数
        ir_drop_tile_rows: "${tile_rows}"  # 当前场景 IR-drop 行 tile
        ir_drop_tile_cols: "${tile_cols}"  # 当前场景 IR-drop 列 tile

ppa:  # PPA 和映射评估配置
  mapping:  # 权重映射网格
    grid:  # 映射参数组合
      mapping_mode: [custom_compact]  # MBAN 定制紧凑映射；同输入层纵向时间复用
      tile_rows: [64]  # 定制矩形子阵行数
      tile_cols: [64]  # 定制矩形子阵列数
      converter_schedule: [parallel]  # 转换器调度方式
      differential_readout: [post_tia_subtractor]  # 差分读出方式
      inter_layer: [none, analog, digital]  # PPA 比较的层间流程
      inter_layer_bits: [4]  # PPA 数字层间位宽
  crosssim:  # CrossSim 参数网格
    grid:  # CrossSim 参数组合
      tile_rows: [64]  # CrossSim 定制子阵行数
      tile_cols: [64]  # CrossSim 定制子阵列数
      weight_bits: [4]  # CrossSim 权重位宽
      crosssim_runs: [8]  # CrossSim 重复运行次数
      seed: [42]  # CrossSim 随机种子
  ppa:  # 面积、功耗、延迟参数网格
    grid:  # PPA 参数组合
      mapping_mode: [custom_compact]  # PPA 使用定制紧凑映射
      tile_rows: [64]  # PPA 定制子阵行数
      tile_cols: [64]  # PPA 定制子阵列数
      converter_schedule: [parallel]  # PPA 转换器调度方式
      input_timing: [analog_single_pulse]  # 输入时序模型
      differential_readout: [post_tia_subtractor]  # PPA 差分读出方式
      weight_bits: [4]  # PPA 权重位宽
      input_bits: [4]  # PPA 输入位宽
      adc_bits: [4]  # PPA ADC 位宽
      technology_node: [32]  # PPA 工艺节点，单位 nm
