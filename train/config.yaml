# MBAN 统一训练配置。每个实验复制一份独立配置，避免结果互相覆盖。

training:                             # 通用训练过程：轮数、学习率、批大小、随机性与断点恢复。
  epochs: 100                        # 训练轮次
  learning_rate: 0.001              # Adam 初始学习率；onecycle 作为峰值。
  scheduler: onecycle                # none（固定）、cosine、step、multistep、onecycle 或 plateau。
  scheduler_step_epochs: 20         # step：每隔多少轮衰减一次。
  scheduler_gamma: 0.5              # step/multistep：学习率乘数。
  scheduler_milestones: [50, 80]    # multistep：在哪些轮次衰减。
  scheduler_patience: 10            # plateau：无提升多少轮后衰减。
  cosine_restart_epochs: 20         # cosine：余弦退火重启周期（轮）。
  onecycle_pct_start: 0.2           # onecycle：预热阶段占比；100轮×0.2=前20轮升温。
  gradient_clip_norm: 1.0           # 梯度范数上限；0 表示关闭裁剪。
  qat_clip_outside_grad: 0.0        # QAT范围裁剪越界反向梯度系数；0为硬裁剪。
  seed: 42                          # 固定数据划分和训练随机性。
  optimization_batch_pixels: 16384  # 每次参数更新使用的像素数；改变它会改变梯度批大小和每轮更新次数。
  train_pixels_per_image: 8192     # 每张图每轮严格独立抽取的像素数；0表示遍历全部像素。
  validation_pixels_per_image: 8192 # 训练期每张验证图固定抽取的像素数；0表示训练期全量验证。
  images_per_batch: 4               # 一个训练批次的图像数；多图批降低梯度方差。
  loader_workers: 0                 # Windows 下通常保持 0。
  resume: all                        # none：从头训练；all：恢复模型/优化器/epoch；weights：仅加载权重。
  initial_checkpoint: null          # 新输出目录可从指定断点仅继承模型权重。

target:                               # 从H5元数据选择具有复数IQ字段的目标算法。
  target_algorithm: mv               # 当前H5只有mv_i/mv_q；重打包其他算法IQ后可直接改算法名。

loss:                                 # 所有可组合的训练损失；weight=0表示关闭。
  error_function: mse                # mse、l1或charbonnier；IQ和线性包络统一使用该误差函数。
  charbonnier_epsilon: 0.001         # 仅charbonnier生效，控制零点附近的平滑程度。
  envelope_epsilon: 1.0e-6           # 包络 sqrt(I^2+Q^2+eps) 的数值稳定项。
  terms:
    iq:
      weight: 1.0                    # 复数IQ误差系数。
    envelope:
      weight: 0.1                    # 线性包络误差系数。
    unity:
      weight: 0.0                    # unity_constraint=free 时的软无失真约束系数。
    d1:
      domain: shape                  # shape 或 absolute。
      weight: 0.0                    # 一阶孔径差分正则系数。
    d2:
      domain: shape                  # shape 或 absolute。
      weight: 0.0                    # 二阶孔径差分正则系数。
    lrange:
      limit: 2.0                     # raw control 范围阈值。
      weight: 0.1                    # raw control 范围正则系数。

distillation:                         # 可选的已训练MBAN蒸馏；与H5中的目标算法相互独立。
  distillation_weight: 0.0           # 教师 IQ 蒸馏系数；0 关闭。
  distillation_checkpoint: null      # 仅系数>0时加载蒸馏教师latest.pth。

input:                                # 输入表示：始终保留完整复 IQ，不做有损通道压缩。
  input_normalization: rms           # none、rms或std；只用于网络输入和权重预测。

activation_functions:                # 激活函数库：只定义函数及其公共参数，不指定作用层。
  relu: {}                           # dual 模式下由正负支路拆分完成，不重复执行。
  pwl:
    knee: 0.25                       # |x|超过该值后进入尾部区。
    tail_slope: 0.2                  # 尾部斜率；0 = 硬clip，1 = 线性。
  tanh:
    beta: 3.0                        # tanh(beta*x)；越大越容易饱和。

backbone:                             # 全连接骨干：隐藏层数量、宽度及逐层处理位置。
  hidden_width: 32                  # 当前基线值；0表示按通道数自动推导。
  hidden_layers: 2                   # 当前基线值；输出层自动为 fc{hidden_layers+1}。
  dropout: 0.2                       # 固定训练协议；仅训练时生效。
  branch_mode: dual                  # single：单路；dual：正负半轴双支路 [x+, x-]。
  centering: none                    # none 或 sample_mean；sample_mean 在 dual/L1/L2 之前按样本减均值。
  centering_layers: []               # sample_mean 的作用层；必须是已配置激活函数的隐藏层。
  normalization: none                 # 隐藏层不做运行时归一化。
  normalization_layers: []            # 隐藏层归一化作用层。
  weight_transform: none              # none 或 ws；默认关闭 Weight Standardization。
  weight_transform_layers: []         # ws 时留空表示作用于全部 FC 层。
  weight_transform_epsilon: 1.0e-5    # WS 数值稳定项。
  bias_layers: [fc1, fc2, fc3]       # bias存在的FC层；[]表示无bias，all表示所有FC层。
  running_stat_momentum: 0.1         # 仅运行统计归一化生效；训练期运行统计更新动量。
  running_stat_epsilon: 1.0e-5       # 仅运行统计归一化生效；数值稳定项。
  batch_renorm_rmax: 3.0              # 仅batch_renorm生效；批/运行标准差校正上限。
  batch_renorm_dmax: 5.0              # 仅batch_renorm生效；批/运行均值校正上限。
  layer_activations:                 # 各隐藏FC选择函数库中的激活；未列出的层不激活。
    fc1: relu
    fc2: relu

output_head:                          # 输出层权重表示、控制点和物理约束。
  output_weights: real              # real：实权重；complex：复权重。
  output_controls: 8               # 0为逐通道输出；K为K个控制点，再插值到目标孔径。
  projection_controls: 0            # 后置投影控制点；动态孔径内执行M→Kp→M，与低维output_controls互斥。
  output_interpolation: linear       # linear、nearest 或 cubic（四点 Catmull–Rom）。
  output_domain: nonnegative        # nonnegative 或 signed。
  unity_constraint: hard            # hard 或 free。
  unity_scope: global               # global：角度×通道总和；per_angle：每个角度的通道和。
  angle_selection: center           # center、all、角度数，或 H5 角度索引列表如 [0, 2, 5]。
  angle_reduction: sum              # 多角度输出合成：sum 或 mean。
  control_normalization: none         # ADC前按每个控制向量的最大值归一化。
  control_adc_range: full_scale       # observer或full_scale；具体有符号范围由output_domain决定。
  control_adc_full_scale: 1.0         # full_scale模式下的ADC满量程。

aperture:                             # 接收孔径：动态孔径开关与F-Number。
  dynamic_aperture: true             # true：网络宽度自动取网格最大K并居中放置有效孔径；false：使用全部物理通道。
  f_number: 1.5                      # 越小，孔径随深度扩大越快。

data:                                 # 数据源与固定划分：每个H5独立按相同比例随机划分，再分别合并。
  h5_files: [../data/volunteer_005.h5] # 训练 H5 列表；多数据集时在此继续添加。
  train_ratio: 0.7                   # 每个H5分别随机抽取70%作为训练集。
  validation_ratio: 0.2              # 每个H5分别随机抽取20%作为验证集。
  test_ratio: 0.1                    # 每个H5剩余约10%作为独立测试集。
  split_file: null                   # 固定数据划分 CSV；null：自动生成。
  make_new_split: false              # true：忽略已有划分，重新生成。
  use_train_as_validation: false     # 仅排查过拟合时设 true。

output:                               # 结果目录与训练期重建预览设置。
  output_directory: results/text # MBAN 独立复现目录；实验时用 --set 覆盖。
  use_tgc: true                      # 重建/可视化时是否做深度增益补偿。
  save_images_every_epochs: 0       # 每N轮保存一次 DAS/MV/MBAN 对比图；0：完全不保存。
  visualization_acquisition: invivo_15002 # 训练期对比图所用采集编号。

run:                                  # 运行模式；命令行 --mode 优先于此字段。
  mode: software                     # software：FP32；ptq：后训练量化；qat：量化感知训练。
