algorithms:
  - das
  - mv
  - ccmv
  - esbmv
  - gcfmv
  - cmsaw
  - fdmas

algorithm_labels:
  das: DAS
  mv: MV
  ccmv: CC-MV
  esbmv: ESBMV
  gcfmv: GCF-MV
  cmsaw: CMSAW
  fdmas: F-DMAS

params:
  signal_domain: iq
  select_angles: "1"
  f_number: 1.5
  dr: 60
  dynamic_aperture: true
  tgc: true
  tgc_alpha: 0.5
  window: rect
  interp: linear

algorithm_params:
  das:
    # 默认与其他算法一致：按通道数使用离散动态孔径。
    aperture_mode: discrete

  mv:
    mv_axis: rx
    mv_dl: 0.0
    fbss: true
    subarray_ratio: 0.25
    temporal_win: 9

  ccmv:
    mv_axis: rx
    mv_dl: 0.1
    fbss: true
    subarray_ratio: 0.25
    temporal_win: 9

  esbmv:
    mv_axis: rx
    mv_dl: 0.0
    fbss: true
    subarray_ratio: 0.25
    temporal_win: 9
    num_eig: 0
    eig_threshold: 0.05

  gcfmv:
    mv_axis: rx
    mv_dl: 0.0
    fbss: true
    subarray_ratio: 0.25
    temporal_win: 9
    gcf_low_bins: 1
    gcf_power: 1.0
    tx_subarray_ratio: null
    gcf_tx_low_bins: null

  cmsaw:
    mv_axis: rx
    mv_dl: 0.0
    fbss: true
    subarray_ratio: 0.25
    temporal_win: 9
    lmax_ratio: 0.5
    min_subarray_len: 2
    delta_max: 1.0
    gamma: 1.0
    clip_percentile: 100.0
    depth_smooth_rows: 1

  fdmas: {}

scenes:
  - id: simulation_contrast_speckle
    h5_path: data/simulation.h5
    sample_idx: 0

  - id: simulation_resolution_distortion
    h5_path: data/simulation.h5
    sample_idx: 1

  - id: experiments_contrast_speckle
    h5_path: data/experiments.h5
    sample_idx: 0

  - id: experiments_resolution_distortion
    h5_path: data/experiments.h5
    sample_idx: 1

  - id: carotid_cross
    h5_path: data/in_vivo.h5
    sample_idx: 0

  - id: carotid_long
    h5_path: data/in_vivo.h5
    sample_idx: 1
